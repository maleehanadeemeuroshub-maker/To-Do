<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Flux — Purge Tasks</title>
<link rel="icon" type="image/png+xml" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-theme="light">
<div class="aurora-bg"></div>
<div class="sparkle-field" id="sparkleField"></div>
<svg width="0" height="0"><defs>
  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#C2786A"/><stop offset="55%" stop-color="#E8A98D"/><stop offset="100%" stop-color="#D8A574"/>
  </linearGradient>
  <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#D8A574"/><stop offset="100%" stop-color="#F3DCBF"/>
  </linearGradient>
</defs></svg>

<div class="app-shell" id="appShell">
  <div class="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="greeting-wrap">
        <h1 id="pageTitle">Purge Tasks</h1>
        <p id="pageSub">Clean up completed tasks, or start fresh.</p>
      </div>
    </div>
    <a class="avatar-btn" id="avatarBtn" aria-label="Profile" href="profile.html"></a>
  </div>

  <div class="page-main">
    <div class="page-panel">
      <div class="info-banner">Purging is permanent. Choose carefully — this can't be undone.</div>
      <div class="field">
        <button class="secondary-btn" id="purgeCompletedBtn" style="margin-bottom:10px;">Clear Completed Tasks</button>
        <button class="primary-btn outline" id="purgeAllBtn">Delete All Tasks</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="mark"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.2 6.4L21 10.5l-6.4 2.2L12 19l-2.2-6.3L3 10.5l6.4-2.1L12 2z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z" opacity=".8"/></svg></div>
    <span class="display nav-label">Flux <em>Todo</em></span>
  </div>
  <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar" title="Collapse sidebar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </button>
  <div class="nav-group">
    <a class="nav-item" data-nav href="index.html" title="Tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      <span class="nav-label">Tasks</span> <span class="badge" id="navTaskCount">0</span>
    </a>
    <a class="nav-item" data-nav href="add-task.html" title="Add Task">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="nav-label">Add Task</span>
    </a>
    <a class="nav-item" data-nav href="categories.html" title="Categories">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span class="nav-label">Categories</span>
    </a>
    <a class="nav-item" data-nav href="purge.html" title="Purge Tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>
      <span class="nav-label">Purge Tasks</span>
    </a>
    <a class="nav-item" data-nav href="transfer.html" title="Transfer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
      <span class="nav-label">Transfer</span>
    </a>
    <a class="nav-item" data-nav href="sync.html" title="Sync Devices">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="10" height="20" rx="2"/><rect x="16" y="7" width="6" height="12" rx="1.5"/></svg>
      <span class="nav-label">Sync Devices</span>
    </a>
  </div>
  <div class="nav-divider"></div>
  <div class="nav-group">
    <a class="nav-item" data-nav href="profile.html" title="Profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span class="nav-label">Profile</span>
    </a>
    <button class="nav-item" id="themeNavBtn" title="Toggle theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 009 9 9 9 0 11-9-9z"/></svg>
      <span class="nav-label" id="themeNavLabel">Dark Mode</span>
    </button>
  </div>
  <div class="nav-divider"></div>
  <button class="nav-item danger" id="resetBtn" title="Log Out &amp; Reset">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    <span class="nav-label">Log Out &amp; Reset</span>
  </button>
  <div class="sidebar-footer nav-label">Flux Todo · your data is stored to your account</div>
</aside>

<div class="toast-wrap" id="toastWrap"></div>

<div class="confirm-modal" id="confirmModal">
  <div class="confirm-box">
    <div class="icon" id="confirmIcon">⚠️</div>
    <h3 id="confirmTitle">Are you sure?</h3>
    <p id="confirmText">This action cannot be undone.</p>
    <div class="confirm-actions">
      <button class="secondary-btn" id="confirmCancel">Cancel</button>
      <button class="primary-btn outline" id="confirmOk">Delete</button>
    </div>
  </div>
</div>

<script src="core.js"></script>
<script src="purge.js"></script>
</body>
</html>
